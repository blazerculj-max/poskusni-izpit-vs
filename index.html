<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Poskusni izpit VS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Inter:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: start screen (exam + practice by sklop), then a sticky bar with one question card at a time and a question map; results replace the run */
:root{
  --bg:#f2f6f7; --card:#ffffff; --ink:#122126; --muted:#55686e; --line:#d2dde0;
  --accent:#0c6870; --accent-2:#3b7db5; --soft:#e1eef0; --sel:#d6ebed; --on-accent:#ffffff;
  --good:#1b7647; --good-soft:#e2f2e9; --bad:#b42318; --bad-soft:#fbe6e3; --warn:#94580a; --warn-soft:#fbefd9;
  --f-head:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1518; --card:#132025; --ink:#e2ebed; --muted:#97aab0; --line:#28393f;
    --accent:#4dbfc7; --accent-2:#80b2e2; --soft:#17333a; --sel:#173b42; --on-accent:#061a1d;
    --good:#62d097; --good-soft:#15321f; --bad:#ff9186; --bad-soft:#3b1c19; --warn:#f2b552; --warn-soft:#352812;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1518; --card:#132025; --ink:#e2ebed; --muted:#97aab0; --line:#28393f;
  --accent:#4dbfc7; --accent-2:#80b2e2; --soft:#17333a; --sel:#173b42; --on-accent:#061a1d;
  --good:#62d097; --good-soft:#15321f; --bad:#ff9186; --bad-soft:#3b1c19; --warn:#f2b552; --warn-soft:#352812;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-head);line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 64px;display:grid;gap:18px}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px clamp(16px,3vw,24px)}
.chip{font-family:var(--f-mono);font-size:.78rem;font-weight:600;background:var(--ink);color:var(--bg);padding:3px 9px;border-radius:5px;white-space:nowrap}

.btn{font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.lg{padding:14px 26px;font-size:1.05rem}
button:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}

/* start */
.hero{display:grid;gap:14px;padding-block:8px 6px}
.hero h1{font-size:clamp(2.1rem,6vw,3.2rem);font-weight:800;letter-spacing:-.01em}
.lead{font-size:1.06rem;color:var(--muted);max-width:62ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-family:var(--f-head);font-size:1.7rem;font-weight:800;color:var(--accent);line-height:1.1}
.tile span{font-size:.88rem;color:var(--muted)}
.dist{display:flex;gap:3px;height:44px;border-radius:9px;overflow:hidden}
.dist span{display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--accent);color:var(--on-accent);font-family:var(--f-mono);font-size:.76rem;line-height:1.15;min-width:0}
.dist span:nth-child(n+4){background:var(--accent-2)}
.rules h2{font-size:1.15rem;margin-bottom:10px}
.rules ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.sample{display:grid;gap:8px;font-size:.94rem}
.sample .eyebrow{margin-bottom:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-top:4px}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar-q{font-family:var(--f-head);font-size:1.1rem;white-space:nowrap}
.bar-q b{font-size:1.35rem}
.prog{flex:1 1 120px;height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:80px}
.prog div{height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.ans-count{font-family:var(--f-mono);font-size:.85rem;white-space:nowrap}
.timer{font-family:var(--f-mono);font-weight:600;font-size:1.15rem;font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:9px;background:var(--card);border:1px solid var(--line)}
.timer.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.timer.crit{background:var(--bad-soft);color:var(--bad);border-color:transparent;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}

/* question */
.qcard{display:grid;gap:16px}
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.qmeta .muted{font-size:.9rem}
.flag{margin-left:auto;font:inherit;font-size:.85rem;font-weight:600;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.flag.on{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.qtext{font-size:clamp(1.12rem,2.4vw,1.32rem);font-weight:800;line-height:1.35}
.qtext strong{color:var(--bad);font-weight:800}
.stmts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.stmts li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:10px;background:var(--soft)}
.sn{font-family:var(--f-mono);font-weight:600;font-size:.85rem;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--card);color:var(--accent);border:1px solid var(--line)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:8px}
.opt{font:inherit;color:var(--ink);text-align:left;display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--sel)}
.let{font-family:var(--f-mono);font-weight:600;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:.88rem}
.opt[aria-checked="true"] .let{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.single .opts{grid-template-columns:1fr}
.navrow{display:flex;justify-content:space-between;gap:10px}

/* map */
.map{display:grid;gap:10px}
.map-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.map-head h3{font-size:1rem}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.legend .l-ans{background:var(--sel);border-color:var(--accent)}
.legend .l-flag{background:var(--warn-soft);border-color:var(--warn)}
.legend .l-cur{background:var(--card);border:2px solid var(--ink)}
.grow{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center}
.gl{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.cells{display:flex;flex-wrap:wrap;gap:6px}
.cell{font:inherit;font-family:var(--f-mono);font-size:.8rem;width:36px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.cell.ans{background:var(--sel);border-color:var(--accent)}
.cell.flag{background:var(--warn-soft);border-color:var(--warn)}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}

/* confirm */
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 45%,transparent);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cf{max-width:440px;width:100%;display:grid;gap:12px}
.cf-act{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}

/* results */
.res-hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring svg{width:150px;height:150px;display:block}
.r-bg{fill:none;stroke:var(--line);stroke-width:11}
.r-fg{fill:none;stroke-width:11;stroke-linecap:round}
.r-fg.ok{stroke:var(--good)} .r-fg.bad{stroke:var(--bad)}
.r-num{font-family:var(--f-head);font-weight:800;font-size:34px;fill:var(--ink)}
.r-sub{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.res-txt{display:grid;gap:8px;min-width:0}
.res-txt h1{font-size:clamp(2rem,6vw,2.8rem);font-weight:800}
.pill{justify-self:start;font-family:var(--f-mono);font-weight:600;font-size:.82rem;padding:4px 11px;border-radius:99px}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
@media (max-width:520px){.res-hero{grid-template-columns:1fr;justify-items:center;text-align:center}.pill{justify-self:center}.ring svg{width:130px;height:130px}}
.sk h2,.review h2{font-size:1.15rem}
.skrows{display:grid;gap:10px;margin-top:12px}
.skrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,1.2fr) auto;gap:12px;align-items:center;font-size:.94rem}
.skn{min-width:0}
.skbar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.skbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.sks{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.skrow.zero .sks,.skrow.zero .skn b{color:var(--bad)}
@media (max-width:520px){.skrow{grid-template-columns:1fr auto}.skbar{grid-column:1/-1;order:3}}
.review{display:grid;gap:12px}
.rev-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{font:inherit;font-size:.85rem;font-weight:600;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px clamp(14px,3vw,22px);display:grid;gap:12px}
.rev-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.rnum{font-family:var(--f-head);font-weight:800;font-size:1.1rem}
.rres{margin-left:auto;font-family:var(--f-mono);font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:99px}
.rev.ok .rres{background:var(--good-soft);color:var(--good)}
.rev.bad .rres{background:var(--bad-soft);color:var(--bad)}
.rev.skip .rres{background:var(--warn-soft);color:var(--warn)}
.qtext.sm{font-size:1.02rem}
.rst,.ropt{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.93rem}
.rst li{display:grid;grid-template-columns:auto 26px 1fr;gap:8px;align-items:start}
.tag{font-family:var(--f-mono);font-size:.72rem;font-weight:600;padding:3px 7px;border-radius:5px;white-space:nowrap;min-width:72px;text-align:center}
.tag.t{background:var(--sel);color:var(--accent)}
.tag.f{background:var(--soft);color:var(--muted)}
.rst .sn{width:22px;height:22px;font-size:.75rem}
.ropt li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-radius:9px;border:1px solid var(--line)}
.ropt .let{width:24px;height:24px;font-size:.78rem}
.ropt li.cor{background:var(--good-soft);border-color:transparent}
.ropt li.cor .let{background:var(--good);color:var(--card);border-color:var(--good)}
.ropt li.wrong{background:var(--bad-soft);border-color:transparent}
.ropt li.wrong .let{background:var(--bad);color:var(--card);border-color:var(--bad)}
.ropt em{font-style:normal;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.ex{font-size:.92rem;background:var(--soft);border-radius:9px;padding:10px 12px}
.ex::before{content:"Pojasnilo";font-family:var(--f-mono);font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* practice */
.sm{font-size:.92rem}
.modes{display:grid;gap:14px}
.modes h2{font-size:1.15rem}
.mode-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.mode-head p{margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:none}
.seg button{font:inherit;font-size:.85rem;font-weight:600;padding:6px 13px;border:0;background:var(--card);color:var(--ink);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,255px),1fr));gap:8px}
.skbtn{font:inherit;color:var(--ink);text-align:left;display:grid;gap:7px;align-content:start;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);cursor:pointer;transition:border-color .15s}
.skbtn:hover:not(:disabled){border-color:var(--accent)}
.skbtn:disabled{opacity:.5;cursor:default}
.skbtn .t{display:flex;gap:9px;align-items:baseline;font-weight:600;line-height:1.3}
.skbtn .t b{font-family:var(--f-mono);font-size:.85rem;color:var(--accent);flex:none}
.skbtn .m{font-size:.82rem;color:var(--muted)}
.skbtn.miss{background:var(--soft);border-style:dashed}
.mini{display:block;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent);border-radius:99px}
.reset-row{display:flex;justify-content:flex-end}
.linkbtn{font:inherit;font-size:.85rem;background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 2px}
.linkbtn:disabled{opacity:.5;cursor:default;text-decoration:none}
.opt.cor{border-color:var(--good);background:var(--good-soft)}
.opt.cor .let{background:var(--good);border-color:var(--good);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .let{background:var(--bad);border-color:var(--bad);color:var(--card)}
.stmts li.fb{grid-template-columns:30px 1fr auto}
.stmts .tag{align-self:center}
.fbk{font-family:var(--f-mono);font-weight:600;font-size:.88rem;padding:9px 12px;border-radius:9px}
.fbk.ok{background:var(--good-soft);color:var(--good)}
.fbk.bad{background:var(--bad-soft);color:var(--bad)}
.cell.ok{background:var(--good-soft);border-color:var(--good)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad)}
.legend .l-ok{background:var(--good-soft);border-color:var(--good)}
.legend .l-bad{background:var(--bad-soft);border-color:var(--bad)}
.pill.info{background:var(--sel);color:var(--accent)}
@media (max-width:520px){.stmts li.fb{grid-template-columns:30px 1fr}.stmts li.fb .tag{grid-column:2;justify-self:start}}
/* login */
.login-wrap{min-height:100vh;min-height:100dvh;align-content:center}
.login{max-width:420px;width:100%;margin:0 auto;display:grid;gap:10px;padding:26px clamp(18px,4vw,30px)}
.login h1{font-size:clamp(1.9rem,6vw,2.5rem);font-weight:800}
.lg-form{display:grid;gap:12px;margin-top:8px}
.fld{display:grid;gap:5px;font-size:.88rem;font-weight:600}
.fld input{font:inherit;font-weight:400;font-size:1rem;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.fld input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--sel)}
.lg-err{min-height:1.4em;color:var(--bad);font-size:.9rem;font-weight:600}
.lg-form .btn{width:100%}
.reset-row{gap:16px}
/* teacher */
.teach-card{display:grid;gap:12px;border-color:var(--accent)}
.teach-card h2{font-size:1.15rem;margin-bottom:4px}
.tprog{display:grid;gap:6px}
.tprog .m{font-size:.85rem;color:var(--muted)}
.tsec{display:grid;gap:10px}
.tsec-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tsec-head h2{font-size:1.05rem;display:flex;align-items:center;gap:8px}
.tlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tl{font:inherit;color:var(--ink);width:100%;text-align:left;display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;transition:border-color .15s}
.tl:hover{border-color:var(--accent)}
.tl .tn{font-family:var(--f-mono);font-size:.82rem;font-weight:600;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--soft);color:var(--accent)}
.tl.done .tn{background:var(--good-soft);color:var(--good)}
.tl .tp{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);white-space:nowrap}
@media (max-width:520px){.tl{grid-template-columns:30px 1fr}.tl .tp{grid-column:2}}
.lesson{display:grid;gap:16px}
.lesson .qmeta .pill{margin-left:auto}
.ltitle{font-size:clamp(1.4rem,3.6vw,1.9rem);font-weight:800}
.lsec{display:grid;gap:8px}
.lsec h3{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lsec-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lsec p{line-height:1.65;max-width:72ch}
.lsec ul{margin:0;padding-left:1.2em;display:grid;gap:5px}
.lsec.notes{background:var(--soft);border-radius:11px;padding:12px 14px}
.lsec.traps{background:var(--warn-soft);border-radius:11px;padding:12px 14px}
.lsec.traps h3{color:var(--warn)}
.lsec.example{border:1.5px dashed var(--line);border-radius:11px;padding:12px 14px}
.lact{display:flex;flex-wrap:wrap;gap:10px}
.sbtn{font:inherit;font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;white-space:nowrap}
.sbtn.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.ai{display:grid;gap:12px}
.ai-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px}
.ai-head h2{font-size:1.1rem}
.ai-quick{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{font:inherit;font-size:.85rem;font-weight:600;padding:7px 12px;border-radius:99px;border:1px solid var(--accent);background:var(--sel);color:var(--accent);cursor:pointer}
.chipbtn:disabled{opacity:.5;cursor:default}
.ai-chat{display:grid;gap:8px}
.msg{padding:10px 12px;border-radius:12px;max-width:92%;line-height:1.55}

.cmp{display:grid;gap:10px}
.cmp-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cmp-head h2{font-size:1.05rem}
.tbl-wrap{overflow-x:auto}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fc-setup,.fc-done{display:grid;gap:12px}

.fc-card{min-height:200px;display:grid;align-content:center;gap:14px;text-align:center;padding:28px clamp(18px,4vw,36px);border-width:2px}

.fc-b{font-size:1.02rem;line-height:1.6}
.fc-act{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

.dr-q.ok{border-color:var(--good)} .dr-q.bad{border-color:var(--bad)}
.dr-ctx{color:var(--muted);font-size:.92rem;line-height:1.45}
.dr-st{font-family:var(--f-head);font-weight:800;font-size:clamp(1.1rem,2.8vw,1.35rem);line-height:1.4}
.dr-fb{padding:9px 12px;border-radius:10px;background:var(--sel)}
.dr-q.ok .dr-fb{background:var(--good-soft);color:var(--good)} .dr-q.bad .dr-fb{background:var(--bad-soft);color:var(--bad)}
.dr-ex{font-size:.95rem;line-height:1.55}
.fc-act .dr-t,.fc-act .dr-f{min-width:150px;font-weight:700}
.dr-t{border-color:var(--good);color:var(--good)} .dr-f{border-color:var(--bad);color:var(--bad)}
.dr-miss{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.dr-miss li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:.95rem}
.dg{margin:4px 0 6px;display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.dg figcaption{font-family:var(--f-head);font-weight:800;font-size:.98rem}
.dg-cap{font-size:.85rem;color:var(--muted)}
.dg-tree{display:grid;gap:10px}
.dg-root{justify-self:center;padding:7px 16px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:700;font-size:.92rem;text-align:center}
.dg-kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px}
.dg-node{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--bc);border-radius:10px;padding:8px 10px;font-size:.88rem}
.dg-node b{display:block;margin-bottom:4px}
.dg-node ul{margin:0;padding-left:1.1em;display:grid;gap:2px;color:var(--muted)}
.dg-flow{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 22px;counter-reset:st}
.dg-flow li{position:relative;flex:1 1 130px;display:grid;gap:2px;padding:8px 10px;border-radius:10px;background:var(--sel);font-size:.86rem}
.dg-flow li b{color:var(--accent)}
.dg-flow li span{color:var(--muted)}
.dg-flow li:not(:last-child)::after{content:"→";position:absolute;right:-17px;top:50%;transform:translateY(-50%);color:var(--accent);font-weight:700}
.dg-lanes{display:grid;gap:8px}
.dg-lane{display:grid;grid-template-columns:minmax(110px,170px) 1fr;gap:10px;align-items:center}
.dg-ln{font-weight:700;font-size:.86rem}
.dg-steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 20px}
.dg-steps li{position:relative;display:grid;gap:1px;padding:6px 10px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:.82rem}
.dg-steps li b{font-family:var(--f-mono);color:var(--accent);font-size:.8rem}
.dg-steps li span{color:var(--muted)}
.dg-steps li:not(:last-child)::after{content:"→";position:absolute;right:-15px;top:50%;transform:translateY(-50%);color:var(--muted)}
@media (max-width:560px){.dg-lane{grid-template-columns:1fr}}
@media (max-width:560px){.dg-flow{flex-direction:column;gap:16px}.dg-flow li{flex:none}.dg-flow li:not(:last-child)::after{content:"↓";right:auto;left:50%;top:auto;bottom:-16px;transform:translateX(-50%)}}
.dg-levels{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.dg-levels li{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:10px;padding:8px 12px;border-radius:9px;border-left:5px solid var(--tc);background:color-mix(in srgb,var(--tc) 12%,var(--card));font-size:.88rem}
.dg-levels li b{color:var(--tc)}
.dg-levels .t-ok{--tc:var(--good)} .dg-levels .t-info{--tc:var(--accent)} .dg-levels .t-warn{--tc:var(--warn)} .dg-levels .t-bad{--tc:var(--bad)} .dg-levels .t-muted{--tc:var(--muted)}
@media (max-width:560px){.dg-levels li{grid-template-columns:1fr;gap:2px}}
.dg-bars,.dg-stack{display:grid;gap:8px}
.dg-bar,.dg-srow{display:grid;grid-template-columns:minmax(110px,200px) 1fr auto;gap:10px;align-items:center;font-size:.86rem}
.dg-srow{grid-template-columns:minmax(110px,200px) 1fr}
.dg-bt{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.dg-bt i{display:block;height:100%;background:var(--accent);border-radius:99px}
.dg-bv{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.dg-bv em{font-style:normal;color:var(--muted);font-weight:400}
.dg-st{display:flex;height:22px;border-radius:7px;overflow:hidden}

.dg-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted)}
.dg-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (max-width:560px){.dg-bar{grid-template-columns:1fr auto}.dg-bar .dg-bt{grid-column:1/-1;order:3}.dg-srow{grid-template-columns:1fr}}

/* ---- animated explainers (lesson schemes of type anim) ---- */
.an-stage{display:grid;gap:10px}
.an-svg{width:100%;height:auto;display:block}
.an-ax{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.an-ref{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1;opacity:.55}
.an-seg{stroke:var(--accent-2);stroke-width:2.5;opacity:0;transition:opacity .3s}
.an-pt{fill:var(--accent-2);opacity:0;transition:opacity .3s}
.an-b{fill:var(--accent);transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.an-b.low{fill:var(--good)}
.an-bl{font-family:var(--f-mono);font-size:10px;fill:var(--ink);opacity:0;transition:opacity .3s .25s}
.an-seg.on,.an-pt.on,.an-bl.on{opacity:1}
.an-b.on{transform:scaleY(1)}
.an-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.an-legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.an-legend .k-line{background:var(--accent-2);height:3px;vertical-align:2px}
.an-legend .k-bar{background:var(--accent)}
.an-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.an-stats div{display:grid;gap:2px;padding:8px 10px;border-radius:9px;background:var(--soft);font-size:.84rem;transition:background .3s}
.an.done .an-stats div:last-child{background:var(--good-soft)}
.an-cap{min-height:3.3em;font-size:.92rem;padding:8px 12px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:0 8px 8px 0}
.an-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.an-dots{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.an-dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s}
.an-dots i.on{background:var(--accent)}
@media (max-width:560px){.an-stats{grid-template-columns:1fr}.an-dots{display:none}.an-svg .an-ax{font-size:19px}.an-svg .an-bl{font-size:15px;letter-spacing:-.5px}.an-cap{font-size:.9rem}}
/* cut-off timeline */
.an-cut{display:grid;gap:0;font-size:.84rem}
.an-cr{display:grid;grid-template-columns:76px 1fr 1fr;gap:8px;align-items:center;min-height:36px;border-bottom:1px dashed var(--line)}
.an-cr.hd{border-bottom:1px solid var(--line)}
.an-dl{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-weight:600}
.an-ca,.an-cb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;align-self:stretch;padding:4px 0;position:relative}
.an-h{font-size:.84rem;opacity:.35;transition:opacity .3s}.an-h.on{opacity:1}
.an-chip{font-family:var(--f-mono);font-size:.72rem;padding:3px 8px;border-radius:99px;background:var(--sel);color:var(--accent);opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s,box-shadow .3s}
.an-chip.tok{background:var(--accent);color:var(--on-accent)}
.an-chip.on{opacity:1;transform:none}
.an-chip.hl{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.an-ca{padding-left:20px!important}
.an-chip.pay{position:absolute;left:5px;top:0;bottom:0;width:6px;padding:0;border-radius:0;background:var(--good);transform:scaleY(0);transform-origin:top}
.an-chip.pay.on{transform:scaleY(1)}
.an-chip.pay.end{position:static;width:auto;padding:3px 8px;border-radius:99px;margin-left:0;background:var(--good-soft);color:var(--good);transform:translateY(4px)}
.an-chip.pay.end.on{transform:none}
.an-cutline{position:relative;height:0;border-top:3px solid var(--warn);opacity:.35;transition:opacity .3s;margin:2px 0}
.an-cutline span{position:absolute;right:0;top:-10px;font-family:var(--f-mono);font-size:.7rem;color:var(--warn);background:var(--card);padding:0 6px}
.an-cutline.on{opacity:.75}.an-cutline.hl{opacity:1}
.an-chip:not(.pay){border-radius:8px}
@media (max-width:560px){.an-cr{grid-template-columns:46px 1fr 1fr;gap:6px}.an-chip{font-size:.68rem;padding:3px 6px}.an-ca{padding-left:14px!important}.an-chip.pay{left:2px;width:5px}}
/* trade path */
.an-trade{display:grid;gap:8px;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-areas:"atvp atvp atvp atvp atvp" "kup clk bor clp pro" ". kdd kdd kdd ."}
.n-atvp{grid-area:atvp}.n-kup{grid-area:kup}.n-clk{grid-area:clk}.n-bor{grid-area:bor}.n-clp{grid-area:clp}.n-pro{grid-area:pro}.n-kdd{grid-area:kdd}
.an-node{display:grid;gap:4px;align-content:start;padding:8px 9px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:.78rem;opacity:.4;transition:opacity .3s,box-shadow .3s,border-color .3s}

@media (max-width:560px){.an-trade{grid-template-columns:1fr 1fr;grid-template-areas:"atvp atvp" "kup pro" "clk clp" "bor bor" "kdd kdd"}}

<body>
<div id="app"></div>
<script>
const STORE = 'poskusni-izpit-vs-v2';
const PSTORE = 'poskusni-izpit-vs-napredek-v1';
const KSTORE = 'poskusni-izpit-vs-kljuc-v1';
const DURATION = 60 * 60 * 1000;
const PASS = 24;
const LET = 'ABCDEFGH';
const QUOTA = { 1:8, 2:8, 3:8, 4:4, 5:4, 6:4, 7:4 };
const SK = {
  1: 'Finančni sistem in produkti',
  2: 'Izbor investicijskega sklada',
  3: 'Investicijski skladi in DZU',
  4: 'Trg finančnih instrumentov',
  5: 'Preprečevanje pranja denarja',
  6: 'Obdavčitev',
  7: 'Etika in odnos do vlagateljev'
};

/* Combination answers: number arrays are sets of statements, '-2,5' = all except 2 and 5, 'all', 'none'.
   The correct option is computed: the one whose set equals `truth`. */
function rangeSet(n){ const s = new Set(); for (let i = 1; i <= n; i++) s.add(i); return s; }
function specSet(spec, n){
  if (Array.isArray(spec)) return new Set(spec);
  if (spec === 'all') return rangeSet(n);
  if (spec === 'none') return new Set();
  const s = rangeSet(n); spec.slice(1).split(',').forEach(x => s.delete(Number(x))); return s;
}
function joinList(a){ if (a.length === 1) return String(a[0]); if (a.length === 2) return a[0] + ' in ' + a[1]; return a.slice(0, -1).join(', ') + ' in ' + a[a.length - 1]; }
function specLabel(spec){
  if (Array.isArray(spec)) return spec.length === 1 ? 'samo ' + spec[0] : joinList(spec);
  if (spec === 'all') return 'vse';
  if (spec === 'none') return 'nič od naštetega';
  return 'vse razen ' + joinList(spec.slice(1).split(',').map(Number));
}
function eqSet(a, b){ if (a.size !== b.size) return false; for (const x of a) if (!b.has(x)) return false; return true; }
function prep(q){
  if (q.single) return Object.assign({}, q, { options: q.opts.map((t, k) => ({ text: t, correct: k === q.ans })) });
  const n = q.st.length, truth = new Set(q.truth);
  return Object.assign({}, q, { options: q.opts.map(spec => ({ text: specLabel(spec), correct: eqSet(specSet(spec, n), truth) })) });
}

let BANK = [], BY = {}, S = null, P = null, app = null;
let LESSONS = [], LBY = {}, LQ = {};
let HAS_CLAUDE = false, AI = null, TTS = null, DICT = null, AIOFF = '', AICTL = null, AIBUSY = false;
let SPEAKING = '', DICTST = 'idle', DICTBASE = '';
const CHAT = {}, DRAFT = {};
let MM = {}, SH = {}, RZ = [], CMP = [], FC = [], FCBY = {}, IG = null;
let DR = [], DRBY = {}, QL = null;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
function fmtTime(ms){ ms = Math.max(0, ms); const t = Math.ceil(ms / 1000); const m = Math.floor(t / 60), s = t % 60; return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); }
function pct(x){ return (Math.round(x * 1000) / 10).toFixed(1).replace('.', ','); }
function shuffle(n){ const a = Array.from({ length: n }, (_, i) => i); for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function mix(arr){ return shuffle(arr.length).map(i => arr[i]); }
function tclass(rem){ return rem < 5 * 60000 ? 'crit' : rem < 10 * 60000 ? 'warn' : ''; }
function toTop(){ try { window.scrollTo(0, 0); } catch (e) {} }
const Q = i => BY[S.ids[i]];
const isExam = () => S.mode === 'exam';
const HOMEBTN = `<button class="btn home" data-act="gohome" aria-label="Na začetno stran" title="Na začetno stran"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h5v-6h3v6h5V9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Začetek</span></button>`;
function plural(n, one, two, few, many){ const m = n % 100; return m === 1 ? one : m === 2 ? two : (m === 3 || m === 4) ? few : many; }

/* ---------- persistence ---------- */
function freshP(){ return { seen:{}, miss:{}, plen:20, done:{}, last:null, fc:{}, dr:{}, rv:{}, days:{}, plan:null, ex:[], elim:false, strat:false }; }
/* spaced review: P.rv[id] = [box, dueDay]; a miss (or a lucky guess) goes to box 0 and is due tomorrow,
   each later correct answer moves it up a box (1, 3, 7, 14, 30 days); past the last box it is learned */
const RV_GAP = [1, 3, 7, 14, 30], DAILY_N = 15;
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 864e5);
function schedule(id, ok){
  const r = P.rv[id];
  if (!ok) P.rv[id] = [0, today() + 1];
  else if (r) { const b = r[0] + 1; if (b >= RV_GAP.length) delete P.rv[id]; else P.rv[id] = [b, today() + RV_GAP[b]]; }
}
const dueIds = () => BANK.filter(q => P.rv[q.id] && P.rv[q.id][1] <= today()).map(q => q.id);
function streak(){ let d = today(), n = 0; if (!P.days[d]) d--; while (P.days[d]) { n++; d--; } return n; }
function loadP(){
  try {
    const p = JSON.parse(localStorage.getItem(PSTORE));
    if (p && typeof p.seen === 'object' && typeof p.miss === 'object') {
      const out = Object.assign(freshP(), p);
      if (!p.rv) Object.keys(out.miss).forEach(id => { out.rv[id] = [0, today()]; });   // first run with review: missed questions are due today
      return out;
    }
  } catch (e) {}
  return freshP();
}
function saveP(){ try { localStorage.setItem(PSTORE, JSON.stringify(P)); } catch (e) {} }
function blank(){
  return { phase:'start', mode:'exam', pk:null, ids:[], perm:[], ans:[], flags:[], cur:0,
           startedAt:0, endsAt:0, finishedAt:0, timeout:false, confirm:false, filter:'all', resetAsk:false, tl:null, sk:0, rzq:'', deck:null, di:0, flip:false, fok:0, fbad:0, dk:null, dj:0, da:null, dok:0, dmiss:[] };
}
function load(){
  try {
    const s = JSON.parse(localStorage.getItem(STORE));
    if (!s || !Array.isArray(s.ids)) return null;
    if (s.phase === 'teach' && s.tl && !LBY[s.tl]) s.tl = null;
    if (s.phase === 'fc' && Array.isArray(s.deck) && !s.deck.every(id => FCBY[id])) s.deck = null;
    if (s.phase === 'dr' && Array.isArray(s.dk) && !s.dk.every(id => DRBY[id])) s.dk = null;
    if (s.phase === 'run' || s.phase === 'result') {
      if (!s.ids.length || !s.ids.every(id => BY[id])) return null;
      if (!Array.isArray(s.perm) || s.perm.length !== s.ids.length) return null;
      if (!s.perm.every((p, i) => Array.isArray(p) && p.length === BY[s.ids[i]].options.length)) return null;
      if (!Array.isArray(s.ans) || s.ans.length !== s.ids.length) return null;
    }
    return Object.assign(blank(), s, { confirm:false, resetAsk:false });
  } catch (e) { return null; }
}
function save(){ try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }

/* ---------- drawing questions ---------- */
function prioritized(pool){
  return mix(pool.filter(q => !P.seen[q.id])).concat(mix(pool.filter(q => P.seen[q.id])));
}
// twins (same q.g) are two versions of one question: keep only the first one that comes up
function noTwins(list){ const seen = new Set(); return list.filter(q => !q.g || (!seen.has(q.g) && seen.add(q.g))); }
// calculation questions (q.c): the real exam had almost none and no calculator allowed
const CALC_EXAM_SHARE = 1 / 3, CALC_PRACTICE = 2; // one calc question in about every third exam
function capCalc(list, max){ let n = 0; const keep = [], later = []; list.forEach(q => (q.c && n++ >= max ? later : keep).push(q)); return keep.concat(later); }
function drawExam(){
  const ids = []; let calc = 0; const calcMax = Math.random() < CALC_EXAM_SHARE ? 1 : 0;
  Object.keys(QUOTA).forEach(k => {
    const pick = [];
    for (const q of noTwins(prioritized(BANK.filter(q => String(q.s) === k)))) {
      if (pick.length >= QUOTA[k]) break;
      if (q.c) { if (calc >= calcMax) continue; calc++; }
      pick.push(q);
    }
    mix(pick).forEach(q => ids.push(q.id));
  });
  return ids;
}
function skStats(){
  const st = {}; Object.keys(SK).forEach(k => { st[k] = { n:0, seen:0, miss:0 }; });
  BANK.forEach(q => { const c = st[q.s]; if (!c) return; c.n++; if (P.seen[q.id]) c.seen++; if (P.miss[q.id]) c.miss++; });
  Object.values(st).forEach(c => { c.acc = c.seen >= 5 ? (c.seen - c.miss) / c.seen : null; c.cov = c.n ? c.seen / c.n : 0; });
  return st;
}
/* rough exam forecast: per-sklop share of seen questions whose last answer was right, weighted by the exam quota */
function forecast(){
  const st = skStats(), ks = Object.keys(QUOTA);
  if (ks.some(k => st[k].acc === null)) return { st, est:null };
  const est = ks.reduce((a, k) => a + QUOTA[k] * st[k].acc, 0);
  const risky = ks.filter(k => QUOTA[k] * st[k].acc < 1.5);
  return { st, est, risky };
}
const dayOf = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? Math.floor(Date.UTC(+m[1], m[2] - 1, +m[3]) / 864e5) : null; };
const fmtDay = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? `${+m[3]}. ${+m[2]}. ${m[1]}` : ''; };
/* elimination: an option drops out when it contains a statement marked »not in the answer« or leaves out one marked »in the answer« */
function elimOut(q, oi, marks){
  if (q.single || !marks) return false;
  const set = specSet(q.opts[oi], q.st.length);
  return marks.some((m, k) => (m === 1 && !set.has(k + 1)) || (m === 0 && set.has(k + 1)));
}
const qLab = q => q.lab || (q.neg ? ['ne velja', 'velja'] : ['drži', 'ne drži']);
function markChip(q, m, act, k){
  const lab = qLab(q), txt = m === 1 ? lab[0] : m === 0 ? lab[1] : '?';
  return `<button class="mk${m === 1 ? ' in' : m === 0 ? ' out' : ''}" data-act="${act}" data-k="${k}" title="Klikni: ${esc(lab[0])} → ${esc(lab[1])} → ?">${esc(txt)}</button>`;
}
const cycle = m => m === undefined || m === null ? 1 : m === 1 ? 0 : null;
function hasHistory(){
  return ['seen', 'miss', 'done', 'fc', 'dr', 'rv', 'days'].some(k => P[k] && Object.keys(P[k]).length) || (P.ex && P.ex.length > 0);
}
function weakSk(){
  const st = {}; BANK.forEach(q => { const c = st[q.s] = st[q.s] || { n:0, seen:0, miss:0 }; c.n++; if (P.seen[q.id]) c.seen++; if (P.miss[q.id]) c.miss++; });
  const ks = Object.keys(st), rated = ks.filter(k => st[k].seen >= 5);
  if (rated.length) return rated.sort((a, b) => st[b].miss / st[b].seen - st[a].miss / st[a].seen)[0];
  return ks.sort((a, b) => st[a].seen / st[a].n - st[b].seen / st[b].n)[0];
}
function drawDaily(){
  const used = new Set(), grp = new Set(), out = [];
  const add = (list, max) => { let n = 0; for (const q of list) { if (n >= max || out.length >= DAILY_N) break; if (used.has(q.id) || (q.g && grp.has(q.g))) continue; used.add(q.id); if (q.g) grp.add(q.g); out.push(q); n++; } };
  add(dueIds().map(id => BY[id]).sort((a, b) => P.rv[a.id][1] - P.rv[b.id][1] || P.rv[a.id][0] - P.rv[b.id][0]), 8);
  const w = weakSk(); add(prioritized(BANK.filter(q => String(q.s) === w)), 4);
  add(mix(BANK.filter(q => !P.seen[q.id])), DAILY_N);
  add(mix(BANK.slice()), DAILY_N);
  return capCalc(mix(out), 2).map(q => q.id);
}
function drawPractice(pk){
  if (pk === 'D') return drawDaily();
  if (pk && pk.startsWith('L:')) { const l = LBY[pk.slice(2)]; return l ? capCalc(noTwins(mix(lessonQs(l))), CALC_PRACTICE).slice(0, 15).map(q => q.id) : []; }
  if (pk === 'miss') {
    const pool = BANK.filter(q => P.miss[q.id]);
    const list = noTwins(mix(pool)).slice(0, P.plen || pool.length);
    return list.sort((a, b) => a.s - b.s).map(q => q.id);
  }
  const list = capCalc(noTwins(prioritized(BANK.filter(q => String(q.s) === pk))), CALC_PRACTICE);
  return list.slice(0, P.plen || list.length).map(q => q.id);
}
function begin(mode, pk){
  const ids = mode === 'exam' ? drawExam() : drawPractice(pk);
  if (!ids.length) { S = blank(); save(); render(); toTop(); return; }
  S = blank(); S.mode = mode; S.pk = pk || null; S.phase = 'run'; S.ids = ids;
  S.perm = ids.map(id => shuffle(BY[id].options.length));
  S.ans = ids.map(() => null); S.flags = ids.map(() => false); S.guess = ids.map(() => false);
  S.startedAt = Date.now(); S.endsAt = mode === 'exam' ? S.startedAt + DURATION : 0;
  save(); render(); toTop();
}
function finish(timeout){
  S.phase = 'result'; S.finishedAt = isExam() ? Math.min(Date.now(), S.endsAt) : Date.now();
  S.timeout = !!timeout; S.confirm = false; S.filter = 'all';
  if (isExam()) {
    S.ids.forEach((id, i) => {
      P.seen[id] = 1;
      const a = S.ans[i], ok = a !== null && BY[id].options[a].correct && !(S.guess && S.guess[i]);
      if (ok) delete P.miss[id]; else P.miss[id] = 1;
      schedule(id, ok);
    });
    { const r = results(); P.ex = (P.ex || []).concat({ d:today(), ok:r.ok, pass:r.pass }).slice(-12); }
    saveP();
  }
  save(); render(); toTop();
}
function results(){
  const per = {}; let ok = 0, n = 0;
  if (isExam()) Object.keys(SK).forEach(k => per[k] = { ok:0, n:0 });
  S.ids.forEach((id, i) => {
    const q = BY[id], a = S.ans[i];
    if (!isExam() && a === null) return;
    per[q.s] = per[q.s] || { ok:0, n:0 }; per[q.s].n++; n++;
    if (a !== null && q.options[a].correct) { ok++; per[q.s].ok++; }
  });
  const zero = Object.keys(per).filter(k => per[k].n && per[k].ok === 0);
  return { ok, n, per, zero, pass: isExam() && ok >= PASS && zero.length === 0 };
}
function runTitle(){
  if (isExam()) return 'Poskusni izpit';
  if (S.pk === 'miss') return 'Vadba · zgrešena vprašanja';
  if (S.pk === 'D') return 'Dnevna vaja';

  if (keys.length > 1) h += `<section class="card sk"><h2>Rezultat po sklopih</h2><div class="skrows">${keys.map(k => {

      return `<div class="skrow${exam && p.ok === 0 ? ' zero' : ''}"><span class="skn"><b>S${k}</b> ${esc(SK[k])}</span><span class="skbar"><i style="width:${p.ok / p.n * 100}%"></i></span><span class="sks">${p.ok}/${p.n}</span></div>`;
    }).join('')}</div></section>`;
  h += viewRecLessons();
  const f = S.filter, items = [];
  S.ids.forEach((id, i) => {
    const a = S.ans[i], ok = a !== null && BY[id].options[a].correct;
    if (f === 'all' || (f === 'wrong' && a !== null && !ok) || (f === 'skip' && a === null)) items.push(i);
  });
  const fb = [['all', 'Vsa (' + N + ')'], ['wrong', 'Napačna (' + wrong + ')'], ['skip', 'Brez odgovora (' + skip + ')']];
  h += `<section class="review"><div class="rev-top"><h2>Pregled odgovorov</h2><div class="filters" role="group" aria-label="Prikaži">${fb.map(([k, t]) =>
      `<button data-act="filter" data-f="${k}" aria-pressed="${f === k}">${t}</button>`).join('')}</div></div>
    ${items.length ? items.map(viewRev).join('') : '<p class="muted">V tem pogledu ni vprašanj.</p>'}
  </section>
  <div class="actions">${exam ? '<button class="btn primary lg" data-act="start">Nov poskus</button>' : `<button class="btn primary lg" data-act="practice" data-pk="${esc(S.pk)}">Nova vadba</button>`}${S.pk && S.pk.startsWith('L:') ? `<button class="btn lg" data-act="lesson" data-id="${esc(S.pk.slice(2))}">Nazaj na lekcijo</button>` : ''}<button class="btn lg" data-act="home">Na začetek</button></div>
  </main>`;
  if (S.peek) h += viewPeek();
  return h;
}

/* ---------- from a mistake straight to the lesson: link under the explanation, quick-look overlay, recommendations ---------- */
function lessonLink(q, weak){
  const id = qLesson(q), l = id && LBY[id]; if (!l) return '';
  return `<button class="lessonlink${weak ? ' weak' : ''}" data-act="peek" data-id="${l.id}"><span class="ll-i" aria-hidden="true">📖</span><span>${weak ? 'Ponovi lekcijo' : 'Več v lekciji'}: <b>${esc(l.t)}</b> <em>prosojnice ${esc(l.p)}</em></span></button>`;
}
function viewPeek(){
  const l = LBY[S.peek]; if (!l) return '';
  const inRun = S.phase === 'run';
  return `<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="pk-t" data-act="peekbg"><div class="card cf peek">
    <div class="qmeta"><span class="chip">Sklop ${l.s}</span><span class="muted">${esc(SK[l.s])} · prosojnice ${esc(l.p)}</span></div>
    <h3 id="pk-t">${esc(l.t)}</h3>
    <div class="peek-body">
      ${l.r.map(t => `<p>${fmt(t)}</p>`).join('')}
      ${l.pa ? `<section class="lsec traps"><h3>Pasti na izpitu</h3><ul>${l.pa.map(t => `<li>${fmt(t)}</li>`).join('')}</ul></section>` : ''}
      <section class="lsec notes"><h3>Zapiski</h3><ul>${l.z.map(t => `<li>${fmt(t)}</li>`).join('')}</ul></section>
    </div>
    <div class="cf-act"><button class="btn" data-act="lesson" data-id="${l.id}">${inRun ? 'Celotna lekcija (zapusti vajo)' : 'Odpri celotno lekcijo'}</button><button class="btn primary" data-act="peekclose">Zapri</button></div>
  </div></div>`;
}
function viewRecLessons(){
  const cnt = {};
  S.ids.forEach((id, i) => {
    const a = S.ans[i], ok = a !== null && BY[id].options[a].correct, g = S.guess && S.guess[i];
    if ((isExam() || a !== null) && (!ok || g)) { const l = qLesson(BY[id]); if (l) cnt[l] = (cnt[l] || 0) + 1; }
  });
  const top = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || LBY[a].i - LBY[b].i).slice(0, 5);
  if (!top.length) return '';
  return `<section class="card rec"><h2>Priporočene lekcije</h2><p class="muted sm">Tu so se nabrale napake${S.guess && S.guess.some(Boolean) ? ' in ugibanja' : ''}. Klik odpre kratek povzetek lekcije.</p>
    <div class="rec-list">${top.map(id => `<button class="rec-it" data-act="peek" data-id="${id}"><span class="chip">S${LBY[id].s}</span><span class="rec-t">${esc(LBY[id].t)}</span><span class="rec-n">${cnt[id]} ${plural(cnt[id], 'napaka', 'napaki', 'napake', 'napak')}</span></button>`).join('')}</div></section>`;
}

function viewRev(i){
  const q = Q(i), a = S.ans[i], perm = S.perm[i];
  const ok = a !== null && q.options[a].correct;
  const st = a === null ? 'skip' : ok ? 'ok' : 'bad';
  const lab = q.lab || (q.neg ? ['ne velja', 'velja'] : ['drži', 'ne drži']);
  const truth = new Set(q.truth || []);
  const gs = !!(S.guess && S.guess[i]);
  let h = `<article class="rev ${st}"><div class="rev-head"><span class="rnum">${i + 1}.</span><span class="chip">Sklop ${q.s}</span>${gs ? '<span class="gtag">ugibal</span>' : ''}<span class="rres">${st === 'ok' ? 'Pravilno' : st === 'bad' ? 'Napačno' : 'Brez odgovora'}</span></div>
    <p class="qtext sm">${q.q}</p>`;
  if (!q.single) h += `<ul class="rst">${q.st.map((t, k) => {
      const on = truth.has(k + 1);
      return `<li><span class="tag ${on ? 't' : 'f'}">${on ? lab[0] : lab[1]}</span><span class="sn">${k + 1}</span><span>${esc(t)}</span></li>`;
    }).join('')}</ul>`;
  h += `<ul class="ropt">${perm.map((oi, pos) => {
      const o = q.options[oi];
      const cls = o.correct ? 'cor' : (oi === a ? 'wrong' : '');
      const mark = o.correct ? (oi === a ? 'tvoj odgovor · pravilno' : 'pravilen odgovor') : (oi === a ? 'tvoj odgovor' : '');
      return `<li class="${cls}"><span class="let">${LET[pos]}</span><span>${esc(o.text)}</span>${mark ? `<em>${mark}</em>` : '<span></span>'}</li>`;
    }).join('')}</ul>`;
  if (q.ex) h += `<p class="ex">${esc(q.ex)}</p>`;
  h += lessonLink(q, !ok || gs);
  return h + `</article>`;
}

function move(d){

}
function askSubmit(){ S.confirm = true; render(); const c = app.querySelector('[data-act="confirm"]'); if (c) c.focus(); }

function bind(){
  document.addEventListener('click', e => {
    if (S && (S.peek || S.strat) && e.target.classList && e.target.classList.contains('overlay')) { S.peek = null; S.strat = null; render(); return; }

      case 'ldone': { const id = S.tl; if (id) { if (P.done[id]) delete P.done[id]; else P.done[id] = 1; saveP(); render(); } } break;
      case 'ai': { const l = LBY[S.tl], qk = QUICK.find(x => x[0] === b.dataset.k); if (l && qk) askAI(l, qk[2], qk[1]); } break;
      case 'aistop': if (AICTL) AICTL.abort(); break;
      case 'speak': speakFor(b.dataset.k); break;
      case 'mic': toggleMic(); break;
      case 'mat': { const v = b.dataset.v; stopSpeak(); S = Object.assign(blank(), { phase:v, sk: (v === 'mm' || v === 'ig') ? 1 : 0 }); save(); render(); toTop(); } break;
      case 'msk': S.sk = Number(b.dataset.v); if (S.phase === 'fc') S.deck = null; if (S.phase === 'dr') S.dk = null; save(); render(); if (S.phase === 'ig' && b.closest('.ig-nav')) toTop(); break;
      case 'mmall': app.querySelectorAll('.mm-br').forEach(d => { d.open = b.dataset.v === '1'; }); break;
      case 'fcstart': fcStart(); break;
      case 'fcflip': S.flip = true; save(); render(); break;
      case 'fcno': fcAnswer(false); break;
      case 'fcyes': fcAnswer(true); break;
      case 'fcend': S.deck = null; save(); render(); toTop(); break;
      case 'drstart': drStart(false); break;
      case 'drmiss': drStart(true); break;
      case 'drans': drAnswer(b.dataset.v === '1'); break;
      case 'drnext': drNext(); break;
      case 'drend': S.dk = null; save(); render(); toTop(); break;
      case 'logout': logout(); break;
      case 'plen': P.plen = Number(b.dataset.v); saveP(); render(); break;
      case 'resetp': S.resetAsk = true; render(); { const c = app.querySelector('[data-act="resetok"]'); if (c) c.focus(); } break;
      case 'resetok': { const dropPlan = !!(document.getElementById('rs-plan') || {}).checked;
        P = Object.assign(freshP(), { plen: P.plen, elim: P.elim, plan: dropPlan ? null : P.plan });
        saveP(); S = blank(); S.resetDone = true; render(); toTop(); S.resetDone = false; save(); } break;   // the notice stays until the next render
      case 'select': setAnswer(Number(b.dataset.o)); break;
      case 'prev': move(-1); break;
      case 'next': move(1); break;
      case 'go': S.cur = Number(b.dataset.q); save(); render(); toTop(); break;
      case 'flag': S.flags[S.cur] = !S.flags[S.cur]; save(); render(); break;
      case 'submit': askSubmit(); break;
      case 'cancel': S.confirm = false; S.resetAsk = false; S.leave = false; render(); break;
      case 'gohome': if (S.phase === 'run' && isExam()) { S.leave = true; S.confirm = false; render(); const c = app.querySelector('[data-act="cancel"]'); if (c) c.focus(); } else { stopSpeak(); S = blank(); save(); render(); toTop(); } break;
      case 'leaveok': S = blank(); save(); render(); toTop(); break;

      case 'peek': S.peek = b.dataset.id; render(); { const c = app.querySelector('[data-act="peekclose"]'); if (c) c.focus(); } break;
      case 'peekclose': S.peek = null; render(); break;
      case 'plansave': { const d = (document.getElementById('plan-date') || {}).value, m = Number((document.getElementById('plan-min') || {}).value) || 20;
        if (!dayOf(d)) { const f = document.getElementById('plan-date'); if (f) { f.focus(); f.classList.add('bad'); } break; }
        P.plan = { date:d, min:m }; saveP(); S.planEdit = false; render(); } break;
      case 'planskip': P.plan = { skip:1 }; saveP(); S.planEdit = false; render(); break;
      case 'planedit': S.planEdit = true; if (P.plan && P.plan.skip) P.plan = null; render(); { const f = document.getElementById('plan-date'); if (f) f.focus(); } break;
      case 'strat': S.strat = { id:stratPick(), marks:[], checked:false }; P.strat = true; saveP(); render(); break;
      case 'stratmark': { const k = Number(b.dataset.k); S.strat.marks[k] = cycle(S.strat.marks[k]); render(); } break;
      case 'stratcheck': S.strat.checked = true; render(); break;

      case 'stratclose': S.strat = null; render(); break;

      case 'confirm': finish(false); break;

      return;
    }
    if (!e.target || e.target.id !== 'login') return;
    e.preventDefault();
    if (LOGIN.busy) return;
    const f = e.target.elements;

  document.addEventListener('input', e => {
    if (!e.target || !S) return;

    if (e.target.classList && e.target.classList.contains('an-range')) { const f = e.target.closest('figure.an'); if (f) { f.dataset.step = e.target.value; AN[f.dataset.an] = Number(e.target.value); animApply(f); } }
    if (e.target.id === 'rzq') { S.rzq = e.target.value; const box = document.getElementById('rzlist'); if (box) box.innerHTML = rzList(); }
  });
  document.addEventListener('keydown', e => {
    if (e.target && e.target.id === 'aiq' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault(); const f = document.getElementById('aiform'); if (f && f.requestSubmit) f.requestSubmit(); return;
    }
    if (!S || e.metaKey || e.ctrlKey || e.altKey) return;
    if (S.confirm || S.resetAsk || S.leave || S.peek || S.strat) { if (e.key === 'Escape') { S.confirm = false; S.resetAsk = false; S.leave = false; S.peek = null; S.strat = null; render(); } return; }
    if (S.phase === 'fc' && S.deck && S.di < S.deck.length && !(e.target && /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(e.target.tagName))) {
      if (!S.flip && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); S.flip = true; save(); render(); }
      else if (S.flip && e.key === 'ArrowLeft') { e.preventDefault(); fcAnswer(false); }
      else if (S.flip && e.key === 'ArrowRight') { e.preventDefault(); fcAnswer(true); }
      return;
    }
    if (S.phase === 'dr' && S.dk && S.dj < S.dk.length && !(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))) {
      const k = e.key.toLowerCase();
      if (S.da === null) {
        if (k === 'd' || e.key === 'ArrowLeft') { e.preventDefault(); drAnswer(true); }
        else if (k === 'n' || e.key === 'ArrowRight') { e.preventDefault(); drAnswer(false); }
      } else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); drNext(); }
      return;
    }
    if (S.phase !== 'run') return;
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight') { move(1); e.preventDefault(); return; }
    if (e.key === 'ArrowLeft') { move(-1); e.preventDefault(); return; }
    const k = e.key.toLowerCase();
    if (k === 'u') { if (isExam() || S.ans[S.cur] === null) { if (!S.guess) S.guess = S.ids.map(() => false); S.guess[S.cur] = !S.guess[S.cur]; save(); render(); } else if (BY[S.ids[S.cur]].options[S.ans[S.cur]].correct) markGuess(); return; }
    if (k.length === 1) {
      const pos = 'abcdefgh'.indexOf(k), perm = S.perm[S.cur];
      if (pos >= 0 && pos < perm.length) setAnswer(perm[pos]);
    }
  });
  setInterval(() => {
    if (!S || S.phase !== 'run' || !isExam()) return;
    const rem = S.endsAt - Date.now();
    if (rem <= 0) { finish(true); return; }
    const t = document.getElementById('timer');
    if (t) { t.textContent = fmtTime(rem); t.className = 'timer ' + tclass(rem); }
    const pm = document.getElementById('pace'), pt = document.getElementById('pacet');
    if (pm) pm.style.left = paceFrac() * 100 + '%';
    if (pt) pt.innerHTML = paceTxt(S.ans.filter(x => x !== null).length, S.ids.length);
  }, 500);
}

/* ---------- teacher (lessons in slide order + optional AI teacher inside Claude) ---------- */
const norm = t => String(t).replace(/ /g, ' ').toLowerCase();
function qText(q){ return norm(q.q + ' ' + (q.st || []).join(' ') + ' ' + (q.single ? q.opts.join(' ') : '')); }
function lessonQs(l){

  const kw = (l.kw || []).map(norm);
  return (LQ[l.id] = BANK.filter(q => q.s === l.s && kw.some(k => qText(q).includes(k))));
}
function fmt(t){ return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>'); }
function openLesson(id){

  P.last = id; saveP(); save(); render(); toTop();

function viewPlanCard(){

    const mins = [10, 20, 30, 45, 60, 90], cur = (pl && pl.min) || 20;
    return `<section class="card plan">
      <h2>Tvoj načrt učenja</h2>
      <p class="muted sm">Povej, kdaj imaš izpit in koliko časa imaš na dan. Vsak dan ti predlagam, kaj narediti – od lekcij do poskusnih izpitov.</p>
      <div class="plan-form">
        <label>Datum izpita<input type="date" id="plan-date" value="${esc((pl && pl.date) || '')}"></label>
        <label>Čas na dan<select id="plan-min">${mins.map(m => `<option value="${m}"${m === cur ? ' selected' : ''}>${m} min</option>`).join('')}</select></label>
      </div>

    </section>`;
  }
  const left = dayOf(pl.date) - today(), m = pl.min || 20;
  if (left < 0) return `<section class="card plan"><h2>Tvoj načrt</h2><p>Izpit je bil <b>${fmtDay(pl.date)}</b>. Če ga ponavljaš, nastavi nov datum.</p><div class="cf-act"><button class="btn" data-act="planedit">Nastavi nov datum</button></div></section>`;
  const notDone = LESSONS.filter(l => !P.done[l.id]), nextL = notDone[0];
  const learnDays = Math.max(1, left - 3), perDay = notDone.length ? Math.ceil(notDone.length / learnDays) : 0;
  const fitL = Math.max(1, Math.floor((m - 10) / 8)), lDay = Math.min(perDay, fitL);
  const phase = left <= 3 ? ['Zadnji dnevi', 'poskusni izpiti in ponavljanje'] : notDone.length > LESSONS.length * .4 ? ['Faza 1', 'spoznavanje snovi'] : ['Faza 2', 'utrjevanje in prvi poskusni izpiti'];
  const steps = [];
  if (!P.strat) steps.push(['Strategija za kombinirana vprašanja', '2 min', 'strat', '']);

    if (q.single || q.c || !Array.isArray(q.st)) return; // no calculations in the quick drill
    const tr = new Set(q.truth || []);
    q.st.forEach((t, k) => { const d = { id: q.id + '.' + (k + 1), q, t, ok: q.neg ? !tr.has(k + 1) : tr.has(k + 1) }; DR.push(d); DRBY[d.id] = d; });

function drPool(){ const k = S.sk || 0; return DR.filter(d => !k || d.q.s === k); }
function drSpread(list){
  // keep two statements of the same question apart, so one does not give away the other
  const out = [], rest = list.slice();
  while (rest.length) {
    const prev = out.length ? out[out.length - 1].q.id : null;
    const i = rest.findIndex(d => d.q.id !== prev);
    out.push(rest.splice(i < 0 ? 0 : i, 1)[0]);

}

  const order = mix(pool).sort((a, b) => rank(a) - rank(b));
  Object.assign(S, { dk: drSpread(order.slice(0, 20)).map(d => d.id), dj:0, da:null, dok:0, dmiss:[] });

}

}

  if (pv) { pv.disabled = k === 0; nx.disabled = k === n - 1; }
}
function animStep(fig, delta){
  if (!fig) return false;
  const n = ANK[fig.dataset.kind].n(animData(fig)), k = Number(fig.dataset.step) + delta;
  if (k < 0 || k > n - 1) return false;
  fig.dataset.step = k; AN[fig.dataset.an] = k; animApply(fig); return true;
}
function animStop(){
  if (!ANT) return;
  clearInterval(ANT.t); const b = ANT.fig.querySelector('.an-play'); if (b) b.textContent = '▶ Predvajaj'; ANT = null;
}
function animPlay(fig){
  if (!fig) return;
  if (ANT && ANT.fig === fig) { animStop(); return; }
  animStop();
  const n = ANK[fig.dataset.kind].n(animData(fig));
  if (Number(fig.dataset.step) >= n - 1) { fig.dataset.step = 0; AN[fig.dataset.an] = 0; animApply(fig); }
  ANT = { fig, t: setInterval(() => { if (!fig.isConnected || !animStep(fig, 1) || Number(fig.dataset.step) >= n - 1) animStop(); }, 1700) };
  fig.querySelector('.an-play').textContent = '❚❚ Ustavi';
}
function mountAnims(){ document.querySelectorAll('figure.an').forEach(animApply); }

/* ---------- access: the question bank is AES-GCM encrypted; the key is derived from username + password ---------- */
let ENC = null, LOGIN = { err:'', busy:false, user:'' };
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => { let s = ''; u.forEach(b => { s += String.fromCharCode(b); }); return btoa(s); };
function getKey(){ try { return localStorage.getItem(KSTORE); } catch (e) { return null; } }
function setKey(raw){ try { if (raw) localStorage.setItem(KSTORE, raw); else localStorage.removeItem(KSTORE); } catch (e) {} }
function loadEnc(){
  if (typeof window !== 'undefined' && window.BANK_ENC) return Promise.resolve(window.BANK_ENC);
  return fetch('questions.enc.json', { cache:'no-cache' }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}
async function deriveKey(user, pass){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(user.trim().toUpperCase() + ':' + pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64d(ENC.salt), iterations:ENC.iter, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, true, ['decrypt']);
}
async function openBank(key){
  const buf = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64d(ENC.iv) }, key, b64d(ENC.data));
  const data = JSON.parse(new TextDecoder().decode(buf));
  BANK = data.q.map(prep); BY = {}; BANK.forEach(q => { BY[q.id] = q; });
  LESSONS = Array.isArray(data.l) ? data.l : []; LBY = {}; LQ = {};
  LESSONS.forEach((l, i) => { l.i = i; LBY[l.id] = l; });
  MM = data.mm || {}; SH = data.sh || {}; RZ = data.rz || []; CMP = data.cmp || []; FC = data.fc || []; FCBY = {}; IG = data.ig || null;
  buildDrill();
  FC.forEach(c => { FCBY[c.id] = c; });
  S = load() || blank();
  if (S.phase === 'run' && isExam() && Date.now() >= S.endsAt) finish(true); else render();
}
async function login(user, pass){
  LOGIN = { err:'', busy:true, user:user.trim() }; render();
  try {
    const key = await deriveKey(user, pass);
    await openBank(key);
    setKey(b64e(new Uint8Array(await crypto.subtle.exportKey('raw', key))));
    LOGIN = { err:'', busy:false, user:'' };
  } catch (e) {
    LOGIN = { err:'Napačno uporabniško ime ali geslo.', busy:false, user:user.trim() };
    BANK = []; BY = {}; S = null; render();
  }
}
function logout(){ setKey(null); BANK = []; BY = {}; S = null; LOGIN = { err:'', busy:false, user:'' }; render(); toTop(); }
function errorCard(t, m){ return '<main class="wrap"><section class="card"><h2>' + t + '</h2><p class="muted">' + m + '</p></section></main>'; }
function init(){
  app = document.getElementById('app');
  app.innerHTML = '<main class="wrap"><p class="muted">Nalagam …</p></main>';
  P = loadP();
  bind();
  initCaps();
  if (!(window.crypto && crypto.subtle)) { app.innerHTML = errorCard('Brskalnik ni podprt', 'Odpri stran v posodobljenem brskalniku (Chrome, Safari, Firefox ali Edge).'); return; }
  loadEnc().then(async enc => {
    ENC = enc;
    const saved = getKey();
    if (saved) {
      try { await openBank(await crypto.subtle.importKey('raw', b64d(saved), { name:'AES-GCM' }, true, ['decrypt'])); return; }
      catch (e) { setKey(null); BANK = []; BY = {}; S = null; }
    }
    render();
  }).catch(() => { app.innerHTML = errorCard('Vprašanj ni bilo mogoče naložiti', 'Osveži stran in poskusi znova.'); });
}

if (typeof document !== 'undefined') init();
else if (typeof module !== 'undefined') module.exports = { prep, specSet, specLabel, eqSet };
